name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: 'pip'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    # Tests are self-contained (in-memory fixtures in tests/conftest.py plus the checked-in
    # data/sample_deliveries.csv); they do not need data/IPL.csv or the cleaned CSV, so they
    # run before the pipeline step.
    - name: Run Test Suite
      run: |
        pytest -v

    - name: Verify CLI Pipeline Execution
      run: |
        python run_pipeline.py --skip-validation
